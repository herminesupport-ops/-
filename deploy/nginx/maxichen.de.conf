server {
    listen 80;
    server_name maxichen.de;
    return 301 https://maxichen.de$request_uri;
}

server {
    listen 443 ssl;
    server_name maxichen.de;

    ssl_certificate /etc/letsencrypt/live/maxichen.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maxichen.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://10.0.5.112:7777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
}
